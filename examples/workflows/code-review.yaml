# Example Workflow: Full Code Review

id: code_review_workflow
name: Code Review Workflow
description: Complete PR review using multiple agents

steps:
  - id: fetch_pr
    tool: github.review_pr
    input:
      owner: "{{owner}}"
      repo: "{{repo}}"
      pr_number: "{{pr_number}}"

  - id: security_review
    agent: reviewer
    input:
      task: "Perform security review of the PR"
    dependsOn: ["fetch_pr"]

  - id: quality_review
    agent: reviewer
    input:
      task: "Perform quality and maintainability review"
    dependsOn: ["fetch_pr"]

  - id: final_summary
    agent: researcher
    input:
      task: "Combine all reviews into a final recommendation"
    dependsOn: ["security_review", "quality_review"]